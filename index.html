<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamrun Time + Weather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

<style>
  /* ===== EASY DESIGN SETTINGS ===== */
  :root {
    --text: #ffffff;
    --shadow: 0 2px 5px rgba(0,0,0,.85);
    --font: Arial, Helvetica, sans-serif;

    /* Change these to customise the backing */
    --backing: rgba(0, 0, 0, 0.68);
    --corner-radius: 7px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text);
  }

  .overlay {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 11px;
    white-space: nowrap;

    /* ===== BACKING / READABILITY ===== */
    background: var(--backing);
    border-radius: var(--corner-radius);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);

    text-shadow: var(--shadow);
  }

  .time-row {
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }

  .date-row {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.1;
    opacity: .95;
  }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.1;
  }

  .weather-icon {
    font-size: 18px;
    /* Force the imported web font */
    font-family: "Noto Color Emoji", sans-serif;
    font-weight: 400;
    margin-left: 2px;
  }

  .weather-source {
    font-size: 8px;
    font-weight: 400;
    opacity: .65;
    margin-left: 2px;
  }

  #error {
    display: none;
    font-size: 12px;
  }
</style>
</head>

<body>
<div class="overlay">
  <div class="time-row">
    <span id="time">--:--</span>
    <span id="zone">AEST</span>
  </div>

  <div class="date-row" id="date">--/--/----</div>

  <div class="weather-row">
    <span id="location">Launceston</span>
    <span>·</span>
    <span id="temperature">--°C</span>
    <span>·</span>
    <span id="condition">Loading...</span>
    <span class="weather-icon" id="icon">🌤️</span>
    <span class="weather-source"> </span>
  </div>

  <div id="error">Weather unavailable</div>
</div>

<script>
/* =========================================================
   EDIT THESE SETTINGS
   ========================================================= */

var CONFIG = {
  // Name displayed beside the weather:
  locationName: "Launceston",

  // Coordinates for the weather location:
  // Launceston, Tasmania
  latitude: -41.404105172618266,
  longitude: 147.09362623682063,

  // IANA timezone. Australia/Hobart automatically handles
  // Australian daylight saving time.
  timezone: "Australia/Hobart",

  // Automatically show AEST/AEDT based on the timezone offset.
  // Set to a string such as "AEST" if you want to force a label.
  forceTimezoneLabel: null,

  // 24-hour clock:
  use24Hour: false,

  // Weather refresh interval:
  weatherRefreshMinutes: 10
};

/* =========================================================
   CLOCK
   ========================================================= */

function getTimezoneLabel() {
  if (CONFIG.forceTimezoneLabel) return CONFIG.forceTimezoneLabel;

  var parts = new Intl.DateTimeFormat("en-AU", {
    timeZone: CONFIG.timezone,
    timeZoneName: "longOffset"
  }).formatToParts(new Date());

  // Older browser safe compatibility (removed optional chaining syntax)
  var tzPart = parts.find(function(p) { return p.type === "timeZoneName"; });
  var offset = tzPart ? tzPart.value : "";

  // Australia/Hobart:
  // GMT+10:00 = AEST
  // GMT+11:00 = AEDT
  if (offset.indexOf("+11") !== -1) return "AEDT";
  if (offset.indexOf("+10") !== -1) return "AEST";

  // Generic fallback for other locations.
  return offset.replace("GMT", "UTC") || "LOCAL";
}

function updateClock() {
  var now = new Date();

  var timeOptions = {
    timeZone: CONFIG.timezone,
    hour: "2-digit",
    minute: "2-digit",
    hour12: !CONFIG.use24Hour
  };

  var dateOptions = {
    timeZone: CONFIG.timezone,
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  };

  document.getElementById("time").textContent =
    new Intl.DateTimeFormat("en-AU", timeOptions).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-AU", dateOptions).format(now);

  document.getElementById("zone").textContent =
    getTimezoneLabel();
}

updateClock();
setInterval(updateClock, 250);

/* =========================================================
   WEATHER
   ========================================================= */

function weatherDescription(code) {
  var map = {
    0: ["Clear", "☀️"],
    1: ["Mainly clear", "🌤️"],
    2: ["Partly cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Fog", "🌫️"],
    48: ["Fog", "🌫️"],
    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],
    56: ["Freezing drizzle", "🌧️"],
    57: ["Heavy freezing drizzle", "🌧️"],
    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],
    66: ["Freezing rain", "🌧️"],
    67: ["Heavy freezing rain", "🌧️"],
    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],
    77: ["Snow grains", "❄️"],
    80: ["Rain showers", "🌦️"],
    81: ["Rain showers", "🌧️"],
    82: ["Heavy showers", "⛈️"],
    85: ["Snow showers", "🌨️"],
    86: ["Heavy snow showers", "❄️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm + hail", "⛈️"],
    99: ["Thunderstorm + hail", "⛈️"]
  };

  return map[code] || ["Unknown", "🌤️"];
}

async function updateWeather() {
  var error = document.getElementById("error");

  var url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + encodeURIComponent(CONFIG.latitude) +
    "&longitude=" + encodeURIComponent(CONFIG.longitude) +
    "&current=temperature_2m,weather_code" +
    "&temperature_unit=celsius" +
    "&timezone=" + encodeURIComponent(CONFIG.timezone);

  try {
    var response = await fetch(url, { cache: "no-store" });

    if (!response.ok) throw new Error("Weather API error");

    var data = await response.json();

    var weatherData = weatherDescription(data.current.weather_code);
    var condition = weatherData[0];
    var icon = weatherData[1];

    document.getElementById("location").textContent = CONFIG.locationName;
    document.getElementById("temperature").textContent =
      Math.round(data.current.temperature_2m) + "°C";
    document.getElementById("condition").textContent = condition;
    document.getElementById("icon").textContent = icon;

    error.style.display = "none";
  } catch (e) {
    error.style.display = "block";
  }
}

updateWeather();
setInterval(updateWeather, CONFIG.weatherRefreshMinutes * 60 * 1000);
</script>
</body>
</html>
